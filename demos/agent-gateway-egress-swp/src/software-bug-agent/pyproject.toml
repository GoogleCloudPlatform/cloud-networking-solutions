[project]
name = "software-bug-agent"
version = "0.1.0"
description = "Software bug triage agent — CUJ2 egress demo (Agent Gateway → SWP → Cloud NAT)"
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Must stay aligned with the pinned versions in deploy_agent.py requirements list.
    "google-cloud-aiplatform[agent_engines]>=1.149.0,<1.154.0",
    "google-adk[a2a,agent-identity]==1.34.0",
    "google-auth>=2.0",
    # mcp is the MCP *client* SDK used by ADK's MCPToolset internally.
    # Pinned here to match the container requirement in deploy_agent.py and prevent
    # local dev from resolving a mcp 2.x build (breaking API change).
    "mcp>=1.28.1,<2.0.0",
    "cloudpickle",
    "pydantic",
    "python-dotenv>=1.1.0",
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-exporter-gcp-logging",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["software_bug_agent"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
