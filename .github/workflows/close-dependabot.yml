name: Auto-Close Dependabot PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Close Dependabot PR
        run: |
          gh pr close "${{ github.event.pull_request.number }}" \
            --comment "Dependabot is disabled in this repository in favor of Forking Renovate batching. Closing automated PR." \
            --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
